openapi: 3.0.3
info:
  title: GreenPoint API
  version: 1.0.0
  description: API contract starter for the recycling rewards backend.
servers:
  - url: http://localhost:3003/api
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Rewards
  - name: Wallet
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        "200":
          description: API is running
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user and return tokens
      responses:
        "201":
          description: User registered
        "400":
          description: Validation failed
        "409":
          description: Phone number already registered
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with phone number and password
      responses:
        "200":
          description: Login succeeded
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      tags: [Auth]
      summary: Return the current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
        "401":
          description: Missing or invalid token
  /users/me/summary:
    get:
      tags: [Users]
      summary: Return current user's dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary returned
  /rewards:
    get:
      tags: [Rewards]
      summary: List active rewards
      responses:
        "200":
          description: Rewards returned
  /wallet:
    get:
      tags: [Wallet]
      summary: List current user's vouchers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet returned
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
