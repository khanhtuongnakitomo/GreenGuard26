run_name: m2revamped_20260829_seed42_n640

canonical_names:
  - cap
  - label
  - ring

paths:
  incoming_live_dataset: dataset/incoming/live-dataset
  incoming_true_negative_dataset: dataset/incoming/true-negative
  generated_root: dataset/generated/{run_name}
  legacy_replay_train: dataset/splits/train
  locked_test_root: dataset/test_locked
  candidate_export_root: export/candidates/{run_name}
  logs_root: logs/revamped/{run_name}

review:
  reviewed_negative_list: dataset/incoming/live-dataset/review/reviewed_machine_negatives.txt
  authoritative_overrides_dir: dataset/incoming/live-dataset/review/authoritative_annotations

dataset:
  raw_class_to_canonical:
    0: 1
    1: 0
    2: 2
  sequence_gap_seconds: 45
  split_strategy: balanced_search
  split_ratios:
    train: 0.70
    val: 0.15
    holdout: 0.15
  lighting_thresholds:
    dark_max: 105.0
    bright_min: 130.0
  highlight_threshold: 245
  highlight_buckets:
    moderate_min: 0.05
    severe_min: 0.12
  min_polygon_area_fraction: 0.00005
  min_obb_area_fraction: 0.00003
  min_side_pixels: 2.0
  max_live_aug_variants_per_image: 2
  live_aug_variants_by_class:
    cap: 4
    label: 3
    ring: 2
    default: 2
  legacy_replay_ratio: 0.22
  legacy_domain_variant_count: 1
  similarity_warning_hamming: 6
  required_machine_negative_min: 5
  required_machine_negative_max: 50
  required_machine_negative_groups: 2
  eval_frame_fps: 5.0

training:
  baseline_checkpoint: runs/m2v6_inmachine_seed42_n640/weights/best.pt
  baseline_sha256: 755D3857E334B2E477D19A132A5AFCBF9F661F4CDDE67DE084959CE10BBEAB5F
  model_id: yolo11s-obb
  imgsz: 640
  batch: 24
  val_batch: 16
  workers: 0
  cache: disk
  optimizer: AdamW
  lr0: 0.0002
  epochs: 60
  patience: 12
  fraction: 1.0
  seed: 42
  save_period: 1
  close_mosaic: 10

stage_b:
  epochs: 25
  patience: 8
  lr0: 0.00007
  batch: 24

runtime_contract:
  infer_conf: 0.10
  violation_conf: 0.50
  vote_window: 7
  vote_need: 4
  warmup_seconds: 0.5
  hold_seconds: 1.5

evaluation:
  parity_sample_limit: 24
  locked_test_max_per_class_regression: 0.02
  pc_conf_tolerance: 0.0001
  pc_polygon_iou_min: 0.90
  jetson_polygon_iou_min: 0.85
  machine_holdout_min_map50: 0.80
  machine_holdout_min_macro_f1: 0.80
  cap_min_recall: 0.90
  label_min_recall: 0.95
  cap_min_f1: 0.85
  label_min_f1: 0.90
  ring_min_recall: 0.45
  ring_min_map50: 0.40
  temporal_positive_lock_min: 0.90
  stress_recall_drop_max: 0.10

promotion:
  pc_package_dir: pc-demo/models
  jetson_package_dir: jetson-runtime/models
  model2_training_exports:
    onnx_640: training/model2/export/onnx_640
    onnx_416: training/model2/export/onnx_416
    onnx_768: training/model2/export/onnx_768
  pc_manifest: pc-demo/models/manifest.json
  jetson_manifest: jetson-runtime/models/manifest.json
  jetson_engine: jetson-runtime/models/engines/m2_obb_416.engine
  jetson_engine_manifest: jetson-runtime/models/engines/engine_manifest.json
